<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Library Manager</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
  </nav>

  <div class="container mt-4">
    <form id="f" class="row g-2">
      <div class="col-md-3"><input id="bt" class="form-control" placeholder="Title" required></div>
      <div class="col-md-3"><input id="ba" class="form-control" placeholder="Author" required></div>
      <div class="col-md-2"><input id="bp" type="number" min="0" step="0.01" class="form-control" placeholder="Price" required></div>
      <div class="col-md-2"><input id="bq" type="number" min="0" class="form-control" placeholder="Qty" required></div>
      <div class="col-md-2"><button class="btn btn-success w-100">Save</button></div>
    </form>
    <p id="msg" class="mt-2"></p>

    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-light">
          <tr><th>Title</th><th>Author</th><th>Price</th><th>Qty</th><th>Action</th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>

  <script>
    let books = [];
    let editId = null;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
    }

    async function load() {
      const r = await fetch('/api/books');
      if (r.status == 401) { location = '/login.html'; return; }
      books = await r.json();
      let h = '';
      books.forEach((b, i) => {
        h += `<tr>
          <td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${b.price}</td><td>${b.qty}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="edit(${i})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="del(${b.id})">Delete</button>
          </td></tr>`;
      });
      list.innerHTML = h;
    }

    function edit(i) {
      bt.value = books[i].title;
      ba.value = books[i].author;
      bp.value = books[i].price;
      bq.value = books[i].qty;
      editId = books[i].id;
    }

    async function del(id) {
      if (!confirm('Delete this book?')) return;
      const r = await fetch('/api/books/' + id, { method: 'DELETE' });
      show(r, await r.json());
      load();
    }

    f.onsubmit = async e => {
      e.preventDefault();
      const body = { title: bt.value.trim(), author: ba.value.trim(), price: bp.value, qty: bq.value };
      const r = await fetch(editId ? '/api/books/' + editId : '/api/books', {
        method: editId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      show(r, await r.json());
      if (r.ok) { f.reset(); editId = null; load(); }
    };

    function show(r, d) {
      msg.textContent = d.message || d.error;
      msg.className = r.ok ? 'text-success' : 'text-danger';
    }

    load();
  </script>
</body>
</html>
