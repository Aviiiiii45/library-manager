<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5" style="max-width:400px">
    <div class="card p-4 shadow">
      <h3 class="text-center">Library Manager</h3>
      <input id="u" class="form-control mt-3" placeholder="Username">
      <input id="p" type="password" class="form-control mt-3" placeholder="Password">
      <button class="btn btn-primary mt-3" onclick="send('/api/login')">Login</button>
      <button class="btn btn-outline-secondary mt-2" onclick="send('/api/register')">Register</button>
      <p id="msg" class="mt-3 text-center"></p>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
